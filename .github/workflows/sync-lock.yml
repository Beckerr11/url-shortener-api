name: Sync npm lockfile

on:
  push:
    branches: [chore/remove-unused-roadmap-deps]
    paths:
      - package.json
      - .github/workflows/sync-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/remove-unused-roadmap-deps
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync npm lockfile"
          git push origin HEAD:chore/remove-unused-roadmap-deps
